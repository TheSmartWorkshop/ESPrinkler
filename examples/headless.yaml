# ESPrinkler example - headless 4-zone controller (no display)
#
# The simplest tier: relays + HA + on-device scheduler, no screen. Runs on any ESP32.
# Copy this, create a secrets.yaml alongside it, and adapt zones/pins.
#
# The `sprinkler:` block is the engine (sequencing, durations, pump). The `esprinkler:`
# block is the brain (scheduler + unified state model) and points at the engine by id.

esphome:
  name: esprinkler
  friendly_name: ESPrinkler

esp32:
  board: esp32dev # override for your board (see docs/hardware.md)
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# The on-device scheduler needs a real clock. HA provides one; SNTP is the standalone
# fallback so watering survives an HA outage.
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

external_components:
  # For a standalone config, replace with:
  #   - source: github://TheSmartWorkshop/ESPrinkler@main
  - source:
      type: local
      path: ../components
    components: [esprinkler]

# Relay/valve switches (relay_1..4 + pump_relay). See packages/relays-gpio.yaml.
switch:
  - { platform: gpio, id: relay_1, pin: GPIO16, internal: true, restore_mode: ALWAYS_OFF }
  - { platform: gpio, id: relay_2, pin: GPIO17, internal: true, restore_mode: ALWAYS_OFF }
  - { platform: gpio, id: relay_3, pin: GPIO18, internal: true, restore_mode: ALWAYS_OFF }
  - { platform: gpio, id: relay_4, pin: GPIO19, internal: true, restore_mode: ALWAYS_OFF }
  - { platform: gpio, id: pump_relay, pin: GPIO21, internal: true, restore_mode: ALWAYS_OFF }

# --- The engine ------------------------------------------------------------------
sprinkler:
  - id: yard
    main_switch: "Sprinklers"
    auto_advance_switch: "Auto Advance"
    reverse_switch: "Reverse"
    multiplier_number:
      name: "Seasonal Adjust"
    repeat_number:
      name: "Repeat"
    pump_start_pump_delay: 3s
    pump_stop_pump_delay: 2s
    valves:
      - valve_switch: "Front Lawn"
        enable_switch: "Front Lawn Enabled"
        valve_switch_id: relay_1
        pump_switch_id: pump_relay
        run_duration_number:
          name: "Front Lawn Duration"
          initial_value: 15
          unit_of_measurement: min
      - valve_switch: "Back Lawn"
        enable_switch: "Back Lawn Enabled"
        valve_switch_id: relay_2
        pump_switch_id: pump_relay
        run_duration_number:
          name: "Back Lawn Duration"
          initial_value: 15
          unit_of_measurement: min
      - valve_switch: "Flower Beds"
        enable_switch: "Flower Beds Enabled"
        valve_switch_id: relay_3
        pump_switch_id: pump_relay
        run_duration_number:
          name: "Flower Beds Duration"
          initial_value: 25
          unit_of_measurement: min
      - valve_switch: "Veg Garden"
        enable_switch: "Veg Garden Enabled"
        valve_switch_id: relay_4
        pump_switch_id: pump_relay
        run_duration_number:
          name: "Veg Garden Duration"
          initial_value: 30
          unit_of_measurement: min

# --- The brain -------------------------------------------------------------------
esprinkler:
  sprinkler_id: yard
  time_id: sntp_time
  state:
    name: "State"
  active_zone:
    name: "Active Zone"
  next_run:
    name: "Next Run"
  total_remaining:
    name: "Total Time Remaining"
  rain_delay:
    name: "Rain Delay"
  schedule_enabled:
    name: "Schedule Enabled"
  zones:
    - name: "Front Lawn"
      flow_type: sprinkler
      active: { name: "Front Lawn Active" }
      remaining: { name: "Front Lawn Remaining" }
    - name: "Back Lawn"
      flow_type: sprinkler
      active: { name: "Back Lawn Active" }
      remaining: { name: "Back Lawn Remaining" }
    - name: "Flower Beds"
      flow_type: drip
      active: { name: "Flower Beds Active" }
      remaining: { name: "Flower Beds Remaining" }
    - name: "Veg Garden"
      flow_type: drip
      active: { name: "Veg Garden Active" }
      remaining: { name: "Veg Garden Remaining" }
  scheduler:
    programs:
      - start_time: "06:00"
        days: [mon, wed, fri]
