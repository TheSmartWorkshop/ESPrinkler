# ESPrinkler example — 6-zone controller with a monochrome OLED
#
# Adds an I²C SSD1306 status screen to the headless build. Still runs on a modest ESP32.
# STATUS: scaffolding.

esphome:
  name: esprinkler-oled
  friendly_name: ESPrinkler (OLED)

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  esprinkler_core: !include ../packages/core.yaml
  esprinkler_relays: !include ../packages/relays-mcp23017.yaml
  esprinkler_display: !include ../packages/display-oled.yaml

esprinkler:
  zones:
    - { name: "Front Lawn", output: relay_1, flow_type: sprinkler }
    - { name: "Back Lawn", output: relay_2, flow_type: sprinkler }
    - { name: "Side Yard", output: relay_3, flow_type: sprinkler }
    - { name: "Flower Beds", output: relay_4, flow_type: drip }
    - { name: "Veg Garden", output: relay_5, flow_type: drip }
    - { name: "Planters", output: relay_6, flow_type: drip }
  master_output: pump_relay
  scheduler:
    programs:
      - start_time: "05:30:00"
        days: [tue, thu, sat]
