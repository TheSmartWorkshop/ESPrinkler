# ESPrinkler example - 4-zone controller with OLED + rotary encoder
#
# Adds an I2C SSD1306 status screen and an EC11 rotary encoder (with push button) to
# the headless build. The OLED renders the entity-contract state and the encoder drives
# a card-stack UI (rotate = switch card, press = activate). All ids match the conventions
# expected by packages/display-oled.yaml and packages/input-encoder.yaml.

# Flip relay_inverted to "true" for active-low relay boards.
# clock_format: "24" for 24-hour (default), "12" for 12-hour with AM/PM.
# web_pin is shown on the Info card; set the matching auth in web_server below.
substitutions:
  relay_inverted: "false"
  clock_format: "24"
  web_pin: "(not set)"

esphome:
  name: esprinkler-oled
  friendly_name: ESPrinkler (OLED)

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

external_components:
  - source:
      type: local
      path: ../components
    components: [esprinkler]

# OLED on I2C (GPIO21/22 on the classic ESP32). Relays on other GPIO.
i2c:
  sda: GPIO21
  scl: GPIO22
  # 400 kHz: cuts the SSD1306 framebuffer push from ~180 ms (ESPHome's 50 kHz
  # default) to ~23 ms so the per-second countdown actually ticks every second.
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: oled_font_sm
    size: 12
  - file: "gfonts://Roboto@500"
    id: oled_font_md
    size: 19
  - file: "gfonts://Roboto@500"
    id: oled_font_lg
    size: 20

switch:
  - platform: gpio
    id: relay_1
    pin: GPIO16
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    pin: GPIO17
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_3
    pin: GPIO18
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_4
    pin: GPIO19
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: pump_relay
    pin: GPIO23
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: esprinkler_oled
    # 250 ms keeps the per-second countdown smooth (display ticks 4x faster
    # than the brain publishes). Encoder handlers do NOT call
    # component.update -- that's what caused the "took a long time" lag last
    # round.
    update_interval: 250ms
    lambda: |-
      // Stacked clock at top-right; 12 vs 24-hour is the clock_format substitution.
      // ESP-IDF newlib's strftime has no %-I (no-pad hour), so 12-hour is built
      // by hand with snprintf and 24-hour goes through strftime.
      {
        ESPTime now = id(sntp_time).now();
        char tb[12] = "--:--";
        char db[8] = " ";
        if (now.is_valid()) {
          if (std::string("${clock_format}") == "12") {
            int h = now.hour;
            int h12 = h % 12;
            if (h12 == 0) h12 = 12;
            snprintf(tb, sizeof(tb), "%d:%02d%s", h12, now.minute, h >= 12 ? "p" : "a");
          } else {
            now.strftime(tb, sizeof(tb), "%H:%M");
          }
          now.strftime(db, sizeof(db), "%a");
        }
        it.print(128, 0, id(oled_font_sm), TextAlign::TOP_RIGHT, tb);
        it.print(128, 12, id(oled_font_sm), TextAlign::TOP_RIGHT, db);
      }
      // Friendly-name lookup: the sprinkler block uses generic "Zone N" names;
      // the user can rename via the zoneN_name text entities (web UI / HA),
      // and we use those for display. Falls back to a sensible default if the
      // text entity is empty.
      auto zone_label = [&](int zi) -> std::string {
        std::string s;
        switch (zi) {
          case 0: s = id(zone1_name).state; break;
          case 1: s = id(zone2_name).state; break;
          case 2: s = id(zone3_name).state; break;
          case 3: s = id(zone4_name).state; break;
        }
        if (s.empty()) {
          char buf[12];
          snprintf(buf, sizeof(buf), "Zone %d", zi + 1);
          s = buf;
        }
        return s;
      };
      auto active_zone_label = [&]() -> std::string {
        auto av = id(yard).active_valve();
        if (!av.has_value()) return "—";
        return zone_label((int) *av);
      };
      // ADJUST mode trumps the card stack: live target + edit indicator.
      // Header switches to "Running" once esp_state confirms the start --
      // visible feedback that the press actually fired.
      if (id(esp_ui_mode) == 1) {
        std::string zone = active_zone_label();
        std::string st = id(esp_state).has_state() ? id(esp_state).state : std::string();
        const char *header =
            (st == "running" || st == "manual") ? "Running" :
            (st == "paused") ? "Paused" : "Adjust run";
        it.print(0, 0, id(oled_font_sm), header);
        it.printf(0, 14, id(oled_font_sm), "%s", zone.c_str());
        int t = id(esp_ui_adjust_target);
        if (t < 0) t = 0;
        char buf[10];
        snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
        it.print(0, 28, id(oled_font_lg), buf);
        it.print(0, 48, id(oled_font_sm), "Turn dial +/-1m");
        return;
      }
      const int z = 4;
      const int total_cards = 7 + z;  // 0=Status, 1..4=Zones, 5=Start, 6=Stop, 7=Pause, 8=Rain, 9=Auto, 10=Info
      const int card = ((id(esp_ui_card) % total_cards) + total_cards) % total_cards;
      if (card == 0) {  // STATUS
        it.print(0, 0, id(oled_font_md), "ESPrinkler");
        std::string st = id(esp_state).has_state() ? id(esp_state).state : "—";
        it.printf(0, 26, id(oled_font_sm), "State: %s", st.c_str());
        if (st == "running" || st == "manual") {
          std::string zone = active_zone_label();
          it.printf(0, 36, id(oled_font_sm), "Zone: %s", zone.c_str());
          int displayed;
          if (id(esp_pending_stop_in_secs) > 0) {
            displayed = id(esp_pending_stop_in_secs);
          } else if (id(esp_total_remaining).has_state()) {
            displayed = (int) id(esp_total_remaining).state + id(esp_pending_ext_seconds);
          } else {
            displayed = -1;
          }
          if (displayed >= 0)
            it.printf(0, 48, id(oled_font_sm), "Remaining: %d:%02d", displayed / 60, displayed % 60);
        } else {
          std::string next = id(esp_next_run).has_state() ? id(esp_next_run).state : "—";
          it.printf(0, 48, id(oled_font_sm), "Next: %s", next.c_str());
        }
      } else if (card >= 1 && card <= z) {  // ZONE i
        int zi = card - 1;
        std::string label = zone_label(zi);
        it.printf(0, 14, id(oled_font_sm), "Zone %d", zi + 1);
        it.print(0, 26, id(oled_font_lg), label.c_str());
        it.print(0, 48, id(oled_font_sm), "Press to run");
      } else if (card == z + 1) {
        it.print(0, 26, id(oled_font_lg), "Start all");
        it.print(0, 48, id(oled_font_sm), "Press to run cycle");
      } else if (card == z + 2) {
        it.print(0, 26, id(oled_font_lg), "Stop");
        it.print(0, 48, id(oled_font_sm), "Press to shut down");
      } else if (card == z + 3) {
        bool paused = id(esp_state).has_state() && id(esp_state).state == "paused";
        it.print(0, 26, id(oled_font_lg), paused ? "Resume" : "Pause");
        it.print(0, 48, id(oled_font_sm), paused ? "Press to resume" : "Press to pause");
      } else if (card == z + 4) {  // RAIN DELAY toggle
        it.print(0, 26, id(oled_font_lg), "Rain delay");
        if (id(esp_rain_delay).has_state() && (int) id(esp_rain_delay).state > 0) {
          int h = (int) id(esp_rain_delay).state;
          it.printf(0, 48, id(oled_font_sm), "%dh left  press: clear", h);
        } else {
          it.print(0, 48, id(oled_font_sm), "Off  press: +24h");
        }
      } else if (card == z + 5) {  // AUTO ON/OFF
        bool on = id(esp_schedule_enabled).state;
        it.printf(0, 26, id(oled_font_lg), "Auto: %s", on ? "On" : "Off");
        it.print(0, 48, id(oled_font_sm), "Press to toggle");
      } else {  // INFO (card == z + 6)
        it.print(0, 0, id(oled_font_sm), "Info");
        char up[20] = "Up: --";
        if (id(esp_uptime).has_state()) {
          int s = (int) id(esp_uptime).state;
          if (s >= 86400)
            snprintf(up, sizeof(up), "Up: %dd %dh", s / 86400, (s % 86400) / 3600);
          else if (s >= 3600)
            snprintf(up, sizeof(up), "Up: %dh %dm", s / 3600, (s % 3600) / 60);
          else
            snprintf(up, sizeof(up), "Up: %dm %ds", s / 60, s % 60);
        }
        it.print(0, 26, id(oled_font_sm), up);
        std::string ip = id(esp_ip).has_state() ? id(esp_ip).state : "--";
        it.printf(0, 38, id(oled_font_sm), "IP: %s", ip.c_str());
        it.print(0, 48, id(oled_font_sm), "PIN: ${web_pin}");
      }

sprinkler:
  - id: yard
    main_switch: "Sprinklers"
    auto_advance_switch: "Auto Advance"
    reverse_switch: "Reverse"
    multiplier_number:
      name: "Seasonal Adjust"
    repeat_number:
      name: "Repeat"
    pump_start_pump_delay: 3s
    # Generic compile-time names ("Zone N"). Friendly labels live in the runtime
    # `text:` entities below, editable from the web UI / HA -- so users don't
    # need to flash to relabel their zones.
    valves:
      - { valve_switch: "Zone 1", enable_switch: "Zone 1 Enabled", valve_switch_id: relay_1, pump_switch_id: pump_relay, run_duration_number: { name: "Zone 1 Duration", initial_value: 15, unit_of_measurement: min } }
      - { valve_switch: "Zone 2", enable_switch: "Zone 2 Enabled", valve_switch_id: relay_2, pump_switch_id: pump_relay, run_duration_number: { name: "Zone 2 Duration", initial_value: 15, unit_of_measurement: min } }
      - { valve_switch: "Zone 3", enable_switch: "Zone 3 Enabled", valve_switch_id: relay_3, pump_switch_id: pump_relay, run_duration_number: { name: "Zone 3 Duration", initial_value: 25, unit_of_measurement: min } }
      - { valve_switch: "Zone 4", enable_switch: "Zone 4 Enabled", valve_switch_id: relay_4, pump_switch_id: pump_relay, run_duration_number: { name: "Zone 4 Duration", initial_value: 30, unit_of_measurement: min } }

esprinkler:
  id: esprinkler_brain
  sprinkler_id: yard
  time_id: sntp_time
  state:
    name: "State"
    id: esp_state
  active_zone:
    name: "Active Zone"
    id: esp_active_zone
  next_run:
    name: "Next Run"
    id: esp_next_run
  total_remaining:
    name: "Total Time Remaining"
    id: esp_total_remaining
  # Human-friendly "M:SS" version of the above, for the ESPHome web UI (which
  # otherwise just shows raw seconds). The numeric sensor is still used by the
  # OLED + automations.
  total_remaining_text:
    name: "Time Remaining"
    id: esp_total_remaining_text
  rain_delay: { name: "Rain Delay", id: esp_rain_delay }
  schedule_enabled: { name: "Schedule Enabled", id: esp_schedule_enabled }
  zones:
    - { name: "Zone 1", flow_type: sprinkler, active: { name: "Zone 1 Active" }, remaining: { name: "Zone 1 Remaining" } }
    - { name: "Zone 2", flow_type: sprinkler, active: { name: "Zone 2 Active" }, remaining: { name: "Zone 2 Remaining" } }
    - { name: "Zone 3", flow_type: drip, active: { name: "Zone 3 Active" }, remaining: { name: "Zone 3 Remaining" } }
    - { name: "Zone 4", flow_type: drip, active: { name: "Zone 4 Active" }, remaining: { name: "Zone 4 Remaining" } }
  scheduler:
    programs:
      - start_time: "05:30"
        days: weekends

# --- Friendly zone-name overrides ---------------------------------------------------
# Sprinkler valve_switch entities above are named generically ("Zone N") so the
# HA entity_ids stay stable; here we expose one editable text per zone so the
# user can call them "Front Lawn" / "Veg Garden" / etc. from the ESPHome web UI
# (or HA's text-input card). The OLED lambda below reads these for display, and
# `restore_value: true` persists the user's labels across reboots.
text:
  - { platform: template, name: "Zone 1 Name", id: zone1_name, optimistic: true, initial_value: "Zone 1", restore_value: true, mode: text, min_length: 1, max_length: 24, icon: "mdi:rename" }
  - { platform: template, name: "Zone 2 Name", id: zone2_name, optimistic: true, initial_value: "Zone 2", restore_value: true, mode: text, min_length: 1, max_length: 24, icon: "mdi:rename" }
  - { platform: template, name: "Zone 3 Name", id: zone3_name, optimistic: true, initial_value: "Zone 3", restore_value: true, mode: text, min_length: 1, max_length: 24, icon: "mdi:rename" }
  - { platform: template, name: "Zone 4 Name", id: zone4_name, optimistic: true, initial_value: "Zone 4", restore_value: true, mode: text, min_length: 1, max_length: 24, icon: "mdi:rename" }

# --- Rotary encoder + button (card-stack UX over the OLED) --------------------------
# UI state plus the deferred-adjust slots: instead of an immediate shutdown +
# restart (which clicks the relay off for ~3 s), we ride the live remaining down
# to the target on a shortening, or schedule a fresh single-valve run when the
# original ends on an extension. Slots are cleared on use or on user shutdown.
globals:
  - id: esp_ui_card
    type: int
    restore_value: false
    initial_value: "0"
  - id: esp_ui_mode
    type: int
    restore_value: false
    initial_value: "0"
  - id: esp_ui_adjust_target
    type: int
    restore_value: false
    initial_value: "0"
  - id: esp_pending_ext_valve
    type: int
    restore_value: false
    initial_value: "-1"
  - id: esp_pending_ext_seconds
    type: int
    restore_value: false
    initial_value: "0"
  - id: esp_pending_stop_valve
    type: int
    restore_value: false
    initial_value: "-1"
  - id: esp_pending_stop_in_secs
    type: int
    restore_value: false
    initial_value: "0"
  # Idle delay (ms). Default 7 s; shortened to 3 s right after a manual zone
  # start so the user gets a quick glance at "Running" without staring.
  - id: esp_ui_idle_ms
    type: int
    restore_value: false
    initial_value: "7000"

# Auto-commit ADJUST target as pending state and return to Status after the
# idle delay (templated -- see esp_ui_idle_ms above).
script:
  - id: esp_ui_idle
    mode: restart
    then:
      - delay: !lambda 'return id(esp_ui_idle_ms);'
      - lambda: |-
          if (id(esp_ui_mode) == 1) {
            auto active = id(yard).active_valve();
            if (active.has_value()) {
              uint32_t cur = id(yard).time_remaining_active_valve().value_or(0);
              int32_t target = id(esp_ui_adjust_target);
              int32_t delta = target - (int32_t) cur;
              if (delta > 4) {
                id(esp_pending_ext_valve) = (int) *active;
                id(esp_pending_ext_seconds) = delta;
                id(esp_pending_stop_valve) = -1;
                id(esp_pending_stop_in_secs) = 0;
              } else if (delta < -4 && target >= 30) {
                id(esp_pending_stop_valve) = (int) *active;
                id(esp_pending_stop_in_secs) = target;
                id(esp_pending_ext_valve) = -1;
                id(esp_pending_ext_seconds) = 0;
              }
            }
          }
          id(esp_ui_mode) = 0;
          id(esp_ui_card) = 0;
          // Reset idle delay back to the slow default after firing.
          id(esp_ui_idle_ms) = 7000;

# Process the deferred adjust each second.
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto s = id(yard);
          auto active = s->active_valve();
          // Early-stop: count down "seconds-until-shutdown" once per tick.
          if (id(esp_pending_stop_in_secs) > 0 && id(esp_pending_stop_valve) >= 0) {
            if (!active.has_value() || (int) *active != id(esp_pending_stop_valve)) {
              id(esp_pending_stop_in_secs) = 0;
              id(esp_pending_stop_valve) = -1;
            } else {
              id(esp_pending_stop_in_secs) -= 1;
              if (id(esp_pending_stop_in_secs) <= 0) {
                s->shutdown(false);
                id(esp_pending_stop_in_secs) = 0;
                id(esp_pending_stop_valve) = -1;
              }
            }
          }
          if (id(esp_pending_ext_seconds) > 0 && id(esp_pending_ext_valve) >= 0) {
            if (!active.has_value()) {
              s->start_single_valve((size_t) id(esp_pending_ext_valve),
                                   (uint32_t) id(esp_pending_ext_seconds));
              id(esp_pending_ext_seconds) = 0;
              id(esp_pending_ext_valve) = -1;
            } else if ((int) *active != id(esp_pending_ext_valve)) {
              id(esp_pending_ext_seconds) = 0;
              id(esp_pending_ext_valve) = -1;
            }
          }

sensor:
  - platform: rotary_encoder
    id: esp_ui_encoder
    pin_a: { number: GPIO32, mode: { input: true, pullup: true } }
    pin_b: { number: GPIO33, mode: { input: true, pullup: true } }
    publish_initial_value: false
    on_clockwise:
      then:
        - lambda: |-
            if (id(esp_ui_mode) == 1) {
              int t = id(esp_ui_adjust_target) + 60;
              if (t > 4 * 3600) t = 4 * 3600;
              id(esp_ui_adjust_target) = t;
            } else {
              const int z = 4;
              const int n = 7 + z;
              int c = id(esp_ui_card);
              for (int i = 0; i < n; i++) {
                c = (c + 1) % n;
                if (c >= 1 && c <= z) {
                  auto *sw = id(yard).enable_switch(c - 1);
                  if (sw != nullptr && !sw->state) continue;  // skip disabled
                }
                break;
              }
              id(esp_ui_card) = c;
            }
        - script.execute: esp_ui_idle
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(esp_ui_mode) == 1) {
              int t = id(esp_ui_adjust_target) - 60;
              if (t < 60) t = 60;
              id(esp_ui_adjust_target) = t;
            } else {
              const int z = 4;
              const int n = 7 + z;
              int c = id(esp_ui_card);
              for (int i = 0; i < n; i++) {
                c = (c + n - 1) % n;
                if (c >= 1 && c <= z) {
                  auto *sw = id(yard).enable_switch(c - 1);
                  if (sw != nullptr && !sw->state) continue;
                }
                break;
              }
              id(esp_ui_card) = c;
            }
        - script.execute: esp_ui_idle
  - platform: uptime
    id: esp_uptime
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: esp_ip
      internal: true

binary_sensor:
  - platform: gpio
    id: esp_ui_button
    pin: { number: GPIO27, mode: { input: true, pullup: true }, inverted: true }
    internal: true
    on_click:
      # SHORT press: activate current card / commit ADJUST.
      - min_length: 50ms
        max_length: 800ms
        then:
          - lambda: |-
              auto s = id(yard);
              const int z = 4;
              const int n = 7 + z;
              if (id(esp_ui_mode) == 1) {
                auto active = s->active_valve();
                if (active.has_value()) {
                  uint32_t cur = s->time_remaining_active_valve().value_or(0);
                  int32_t target = id(esp_ui_adjust_target);
                  int32_t delta = target - (int32_t) cur;
                  if (delta > 4) {
                    id(esp_pending_ext_valve) = (int) *active;
                    id(esp_pending_ext_seconds) = delta;
                    id(esp_pending_stop_valve) = -1;
                    id(esp_pending_stop_in_secs) = 0;
                  } else if (delta < -4 && target >= 30) {
                    id(esp_pending_stop_valve) = (int) *active;
                    id(esp_pending_stop_in_secs) = target;
                    id(esp_pending_ext_valve) = -1;
                    id(esp_pending_ext_seconds) = 0;
                  }
                }
                id(esp_ui_mode) = 0;
                id(esp_ui_card) = 0;
                return;
              }
              int card = ((id(esp_ui_card) % n) + n) % n;
              if (card == 0) {
                if (s->manual_valve().has_value()) {
                  id(esp_ui_adjust_target) =
                      (int) s->time_remaining_active_valve().value_or(60);
                  id(esp_ui_mode) = 1;
                }
              } else if (card >= 1 && card <= z) {
                int zi = card - 1;
                auto active = s->active_valve();
                bool already_running = active.has_value() && (int) *active == zi;
                if (already_running) {
                  id(esp_ui_adjust_target) =
                      (int) s->time_remaining_active_valve().value_or(60);
                } else {
                  s->start_single_valve(zi);
                  id(esp_ui_adjust_target) = (int) s->valve_run_duration(zi);
                  // Nudge the brain to publish state immediately so the ADJUST
                  // header flips to "Running" on this tick (instead of waiting
                  // up to ~1 s for the next poll).
                  id(esprinkler_brain).update();
                  // Shorter idle (3 s vs 7 s) for a fresh manual start: gives
                  // the user a quick glance at "Running" without making them
                  // stare at the ADJUST screen.
                  id(esp_ui_idle_ms) = 3000;
                }
                id(esp_ui_mode) = 1;
              } else if (card == z + 1) {
                s->start_full_cycle();
              } else if (card == z + 2) {
                s->shutdown();
              } else if (card == z + 3) {
                if (s->paused_valve().has_value()) s->resume();
                else if (s->active_valve().has_value()) s->pause();
              } else if (card == z + 4) {
                bool active_delay =
                    id(esp_rain_delay).has_state() && (int) id(esp_rain_delay).state > 0;
                id(esp_rain_delay).make_call()
                    .set_value(active_delay ? 0.0f : 24.0f).perform();
              } else if (card == z + 5) {
                id(esp_schedule_enabled).toggle();
              }
              // card == z + 6 (INFO): no press action
          - script.execute: esp_ui_idle
      # LONG press: from Status, cancel any active run. From ADJUST, exit without commit.
      - min_length: 801ms
        max_length: 6000ms
        then:
          - lambda: |-
              auto s = id(yard);
              if (id(esp_ui_mode) == 1) {
                id(esp_ui_mode) = 0;
                id(esp_ui_card) = 0;
                return;
              }
              const int z = 4;
              const int n = 7 + z;
              int card = ((id(esp_ui_card) % n) + n) % n;
              if (card == 0 &&
                  (s->active_valve().has_value() || s->paused_valve().has_value())) {
                s->shutdown();
                id(esp_pending_ext_seconds) = 0;
                id(esp_pending_ext_valve) = -1;
                id(esp_pending_stop_in_secs) = 0;
                id(esp_pending_stop_valve) = -1;
              }
          - script.execute: esp_ui_idle

# --- Web UI -------------------------------------------------------------------------
# ESPHome's built-in v3 web server (entity controls + OTA). To require a PIN,
# (1) set the `web_pin` substitution above to your code and (2) uncomment the
# auth: block below. The PIN you set there is what the Info card displays.
web_server:
  version: 3
  port: 80
