# ESPrinkler example — color touchscreen controller (LVGL)
#
# The full-UI tier. Wants an ESP32-S3 with PSRAM (see docs/hardware.md). Drives a color TFT
# + touch and a relay bank.
# STATUS: scaffolding — the LVGL UI in packages/display-lvgl.yaml is still a placeholder.

esphome:
  name: esprinkler-touch
  friendly_name: ESPrinkler (Touch)

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf   # LVGL/PSRAM builds generally prefer esp-idf
  flash_size: 8MB

psram:
  mode: octal
  speed: 80MHz

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  esprinkler_core: !include ../packages/core.yaml
  esprinkler_relays: !include ../packages/relays-mcp23017.yaml
  esprinkler_display: !include ../packages/display-lvgl.yaml

esprinkler:
  zones:
    - { name: "Front Lawn", output: relay_1, flow_type: sprinkler }
    - { name: "Back Lawn", output: relay_2, flow_type: sprinkler }
    - { name: "Flower Beds", output: relay_3, flow_type: drip }
    - { name: "Veg Garden", output: relay_4, flow_type: drip }
  master_output: pump_relay
  scheduler:
    programs:
      - start_time: "06:00:00"
        days: [mon, wed, fri, sun]
