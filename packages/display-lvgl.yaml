# ESPrinkler - LVGL color touchscreen package
#
# A ready-made full-color touch UI built on ESPHome's LVGL integration. This is the most
# demanding tier: it wants an ESP32-S3 with PSRAM and ample flash (see docs/hardware.md).
#
# Defaults target an SPI ILI9341 TFT + XPT2046 resistive touch; override pins via subs.
# The UI is a tabbed Status / Schedule layout and binds to the entity contract by id;
# buttons call sprinkler actions on the controller id given by `sprinkler_controller`.
#
# CONVENTION - your config must define:
#   - sprinkler controller id matching ${sprinkler_controller} (default: yard)
#   - text_sensor id: esp_state, esp_active_zone, esp_next_run
#   - sensor      id: esp_total_remaining
#   - number      id: esp_rain_delay      (esprinkler:.rain_delay)
#   - switch      id: esp_schedule_enabled (esprinkler:.schedule_enabled)
# See examples/touchscreen.yaml for a complete, validated device using this UI.

substitutions:
  sprinkler_controller: "yard"
  spi_clk: GPIO12
  spi_mosi: GPIO11
  spi_miso: GPIO13
  tft_cs: GPIO10
  tft_dc: GPIO9
  tft_reset: GPIO14
  touch_cs: GPIO15
  touch_irq: GPIO16
  lvgl_rotation: "90"
  time_id: sntp_time

spi:
  clk_pin: ${spi_clk}
  mosi_pin: ${spi_mosi}
  miso_pin: ${spi_miso}

display:
  - platform: ili9xxx
    model: ILI9341
    id: tft
    invert_colors: false
    cs_pin: ${tft_cs}
    dc_pin: ${tft_dc}
    reset_pin: ${tft_reset}
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    cs_pin: ${touch_cs}
    interrupt_pin: ${touch_irq}
    update_interval: 50ms
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

lvgl:
  rotation: ${lvgl_rotation}
  displays:
    - tft
  touchscreens:
    - touch
  pages:
    - id: home_page
      widgets:
        - tabview:
            id: main_tabs
            position: top
            size: 14%
            tabs:
              # ---------- Status tab ------------------------------------------------
              - id: tab_status
                name: "Status"
                widgets:
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 4
                      text: !lambda |-
                        return "State: " + (id(esp_state).has_state() ? id(esp_state).state : std::string("—"));
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 32
                      text: !lambda |-
                        return "Zone: " + (id(esp_active_zone).has_state() ? id(esp_active_zone).state : std::string("—"));
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 60
                      text: !lambda |-
                        if (!id(esp_total_remaining).has_state()) return std::string("Left: —");
                        int s = (int) id(esp_total_remaining).state;
                        char buf[24];
                        snprintf(buf, sizeof(buf), "Left: %d:%02d", s / 60, s % 60);
                        return std::string(buf);
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 88
                      text: !lambda |-
                        return "Next: " + (id(esp_next_run).has_state() ? id(esp_next_run).state : std::string("—"));
                  - button:
                      align: BOTTOM_LEFT
                      x: 4
                      y: -8
                      width: 96
                      height: 44
                      widgets:
                        - label: { text: "START", align: CENTER }
                      on_click:
                        - sprinkler.start_full_cycle: ${sprinkler_controller}
                  - button:
                      align: BOTTOM_MID
                      y: -8
                      width: 96
                      height: 44
                      widgets:
                        - label: { text: "PAUSE", align: CENTER }
                      on_click:
                        - sprinkler.pause: ${sprinkler_controller}
                  - button:
                      align: BOTTOM_RIGHT
                      x: -4
                      y: -8
                      width: 96
                      height: 44
                      widgets:
                        - label: { text: "STOP", align: CENTER }
                      on_click:
                        - sprinkler.shutdown: ${sprinkler_controller}
              # ---------- Schedule tab ----------------------------------------------
              - id: tab_schedule
                name: "Schedule"
                widgets:
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 4
                      text: !lambda |-
                        return "Next: " + (id(esp_next_run).has_state() ? id(esp_next_run).state : std::string("—"));
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 32
                      text: !lambda |-
                        if (!id(esp_rain_delay).has_state()) return std::string("Rain delay: —");
                        int h = (int) id(esp_rain_delay).state;
                        char buf[32];
                        if (h <= 0) snprintf(buf, sizeof(buf), "Rain delay: off");
                        else snprintf(buf, sizeof(buf), "Rain delay: %dh remaining", h);
                        return std::string(buf);
                  - label:
                      align: TOP_LEFT
                      x: 8
                      y: 60
                      text: !lambda |-
                        bool on = id(esp_schedule_enabled).state;
                        return std::string("Schedule: ") + (on ? "armed" : "OFF");
                  - button:
                      align: BOTTOM_LEFT
                      x: 4
                      y: -56
                      width: 140
                      height: 44
                      widgets:
                        - label: { text: "+24h Rain", align: CENTER }
                      on_click:
                        - number.set:
                            id: esp_rain_delay
                            value: 24
                  - button:
                      align: BOTTOM_RIGHT
                      x: -4
                      y: -56
                      width: 140
                      height: 44
                      widgets:
                        - label: { text: "Clear delay", align: CENTER }
                      on_click:
                        - number.set:
                            id: esp_rain_delay
                            value: 0
                  - button:
                      align: BOTTOM_MID
                      y: -8
                      width: 200
                      height: 44
                      widgets:
                        - label:
                            align: CENTER
                            text: !lambda |-
                              return id(esp_schedule_enabled).state
                                ? std::string("Disarm schedule")
                                : std::string("Arm schedule");
                      on_click:
                        - switch.toggle: esp_schedule_enabled
        # Floating clock — drawn after the tabview so it sits on top of the tab bar's
        # empty right edge. Visible on every tab.
        - label:
            align: TOP_RIGHT
            x: -8
            y: 6
            text: !lambda |-
              ESPTime now = id(${time_id}).now();
              if (!now.is_valid()) return std::string("--:--");
              char tb[20];
              now.strftime(tb, sizeof(tb), "%a %H:%M");
              return std::string(tb);
