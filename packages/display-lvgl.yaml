# ESPrinkler — LVGL color touchscreen package
#
# A ready-made full-color touch UI (zone tiles, run/stop, schedule editing) built on
# ESPHome's LVGL integration. This is the most demanding tier: it wants an ESP32-S3 with
# PSRAM and ample flash. Bind it to a color TFT (ILI9341/ST7789/GC9A01) + a touch
# controller (XPT2046/FT6x36).
#
# STATUS: scaffolding. Display/touch hardware blocks and the LVGL page tree are placeholders;
# the full UI lands once the entity contract's state model is implemented.

# --- Bus + panel (example: SPI ILI9341). Override pins per board. -----------------
substitutions:
  tft_cs: GPIO10
  tft_dc: GPIO11
  tft_reset: GPIO12
  touch_cs: GPIO13

