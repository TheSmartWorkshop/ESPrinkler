# ESPrinkler - rotary encoder + push button input package
#
# Wires an EC11-style rotary encoder with a center momentary button into the
# OLED's card-stack UI:
#   - rotating cycles forward/backward through cards
#   - pressing executes the card's action (run cycle, stop, pause, +24h rain, etc.)
#
# REQUIREMENTS: also include packages/display-oled.yaml — that package defines the
# `esp_ui_card` global this package writes, and renders each card. Without it the
# button still acts on the brain (so the controller is usable in the dark), but
# there's no visual feedback.
#
# CONVENTION: your config must also define
#   - sprinkler controller id matching ${sprinkler_controller} (default: yard)
#   - number   id: esp_rain_delay        (esprinkler: rain_delay:)
#   - switch   id: esp_schedule_enabled  (esprinkler: schedule_enabled:)
#
# CARD NUMBERING (kept in sync with packages/display-oled.yaml):
#   0  STATUS              (no press action)
#   1  START ALL           -> sprinkler.start_full_cycle
#   2  STOP                -> sprinkler.shutdown
#   3  PAUSE / RESUME      -> pause(); resume() if already paused
#   4  +24H RAIN           -> rain_delay := 24
#   5  CLEAR RAIN          -> rain_delay := 0
#   6  ARM / DISARM SCHED  -> schedule_enabled toggle
#   7+ RUN ZONE i          -> sprinkler.start_single_valve(i)

substitutions:
  sprinkler_controller: yard
  zone_count: "4"
  encoder_pin_a: GPIO32
  encoder_pin_b: GPIO33
  encoder_pin_btn: GPIO27

sensor:
  - platform: rotary_encoder
    id: esp_ui_encoder
    pin_a:
      number: ${encoder_pin_a}
      mode: { input: true, pullup: true }
    pin_b:
      number: ${encoder_pin_b}
      mode: { input: true, pullup: true }
    publish_initial_value: false
    on_clockwise:
      then:
        - lambda: |-
            const int n = 7 + ${zone_count};
            id(esp_ui_card) = (id(esp_ui_card) + 1) % n;
    on_anticlockwise:
      then:
        - lambda: |-
            const int n = 7 + ${zone_count};
            id(esp_ui_card) = (id(esp_ui_card) + n - 1) % n;

binary_sensor:
  - platform: gpio
    id: esp_ui_button
    pin:
      number: ${encoder_pin_btn}
      mode: { input: true, pullup: true }
      inverted: true
    internal: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - lambda: |-
            const int z = ${zone_count};
            const int n = 7 + z;
            int card = ((id(esp_ui_card) % n) + n) % n;
            switch (card) {
              case 0:
                break;  // Status — informational only
              case 1:
                id(${sprinkler_controller}).start_full_cycle();
                break;
              case 2:
                id(${sprinkler_controller}).shutdown();
                break;
              case 3:
                if (id(${sprinkler_controller}).paused_valve().has_value())
                  id(${sprinkler_controller}).resume();
                else if (id(${sprinkler_controller}).active_valve().has_value())
                  id(${sprinkler_controller}).pause();
                break;
              case 4:
                id(esp_rain_delay).make_call().set_value(24.0f).perform();
                break;
              case 5:
                id(esp_rain_delay).make_call().set_value(0.0f).perform();
                break;
              case 6:
                id(esp_schedule_enabled).toggle();
                break;
              default: {
                int zi = card - 7;
                if (zi >= 0 && zi < z)
                  id(${sprinkler_controller}).start_single_valve(zi);
                break;
              }
            }
