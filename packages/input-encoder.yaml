# ESPrinkler - rotary encoder + push button input package
#
# Wires an EC11-style rotary encoder with a center momentary button into the OLED's
# card-stack UI:
#   - rotating cycles forward/backward through cards (Status first, then per-zone
#     run cards, then action cards Start/Stop/Pause/Rain/Auto/Info)
#   - SHORT-press (~50-800 ms) activates the current card's action
#   - LONG-press (>800 ms) on the Status card cancels any active run
#
# ADJUST MODE: a short-press on a "Zone N" card starts that zone AND drops the UI
# into ADJUST mode; a short-press on the Status card while a MANUAL zone is running
# also enters ADJUST mode. In ADJUST mode the display shows the live countdown and
# rotating the dial changes the run length by +/- 1 min. The new total is committed
# (without interrupting the active run) on either a press or 7 s of no input:
#
#   - SHORTENING: the brain stops the run early when the live remaining counts down
#     to the user's target (single click at the new endpoint, no double-click).
#   - EXTENDING:  the run plays out normally and the brain auto-starts a fresh
#     single-valve run for the extra time when the original ends (one click at the
#     natural boundary).
#
# This avoids the "valve off for 2-3 s, then back on" gap during the adjust itself.
#
# REQUIREMENTS: also include packages/display-oled.yaml — that package owns the
# `esp_ui_card`, `esp_ui_mode`, `esp_ui_adjust_target`, and pending-* globals this
# package mutates and renders.
#
# CONVENTION: your config must also define
#   - sprinkler controller id matching ${sprinkler_controller} (default: yard)
#   - number   id: esp_rain_delay        (esprinkler: rain_delay:)
#   - switch   id: esp_schedule_enabled  (esprinkler: schedule_enabled:)
#
# CARD NUMBERING (kept in sync with packages/display-oled.yaml):
#   0          STATUS              (short: enter ADJUST if manual; long: cancel any run)
#   1..N       ZONE i              -> sprinkler.start_single_valve(i-1), then ADJUST
#   N+1        START ALL           -> sprinkler.start_full_cycle
#   N+2        STOP                -> sprinkler.shutdown
#   N+3        PAUSE / RESUME      -> pause(); resume() if already paused
#   N+4        RAIN DELAY          -> toggle: if active, clear; else set +24 h
#   N+5        AUTO ON / OFF       -> schedule_enabled toggle
#   N+6        INFO                (no press action)

substitutions:
  sprinkler_controller: yard
  zone_count: "4"
  encoder_pin_a: GPIO32
  encoder_pin_b: GPIO33
  encoder_pin_btn: GPIO27

# Auto-commit any pending ADJUST target and return to the Status card after 7 s
# of no input. `mode: restart` cancels the pending delay and re-arms it each
# time an encoder event fires.
script:
  - id: esp_ui_idle
    mode: restart
    then:
      - delay: 7s
      - lambda: |-
          // Commit ADJUST target by SETTING pending state; the deferred-action
          // interval below picks it up and either shortens or extends without
          // interrupting the active run.
          if (id(esp_ui_mode) == 1) {
            auto active = id(${sprinkler_controller}).active_valve();
            if (active.has_value()) {
              uint32_t cur = id(${sprinkler_controller}).time_remaining_active_valve().value_or(0);
              int32_t target = id(esp_ui_adjust_target);
              int32_t delta = target - (int32_t) cur;
              if (delta > 4) {
                id(esp_pending_ext_valve) = (int) *active;
                id(esp_pending_ext_seconds) = delta;
                id(esp_pending_stop_valve) = -1;
                id(esp_pending_stop_in_secs) = 0;
              } else if (delta < -4 && target >= 30) {
                id(esp_pending_stop_valve) = (int) *active;
                id(esp_pending_stop_in_secs) = target;
                id(esp_pending_ext_valve) = -1;
                id(esp_pending_ext_seconds) = 0;
              }
            }
          }
          id(esp_ui_mode) = 0;
          id(esp_ui_card) = 0;

# Deferred-action processor: shorten or extend the active run without an
# immediate relay click, then expire the pending state.
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto s = id(${sprinkler_controller});
          auto active = s->active_valve();
          // Early-stop: count down "seconds-until-shutdown" once per tick. When
          // it hits zero, shutdown the active valve (relays click ONCE at the
          // shortened endpoint, not the original endpoint, and the on-screen
          // countdown reads the same value the brain is counting down).
          if (id(esp_pending_stop_in_secs) > 0 && id(esp_pending_stop_valve) >= 0) {
            if (!active.has_value() || (int) *active != id(esp_pending_stop_valve)) {
              id(esp_pending_stop_in_secs) = 0;
              id(esp_pending_stop_valve) = -1;
            } else {
              id(esp_pending_stop_in_secs) -= 1;
              if (id(esp_pending_stop_in_secs) <= 0) {
                s->shutdown(false);
                id(esp_pending_stop_in_secs) = 0;
                id(esp_pending_stop_valve) = -1;
              }
            }
          }
          // Extension: when the original run ends, start a fresh run for the
          // remaining target seconds on the same valve.
          if (id(esp_pending_ext_seconds) > 0 && id(esp_pending_ext_valve) >= 0) {
            if (!active.has_value()) {
              s->start_single_valve((size_t) id(esp_pending_ext_valve),
                                   (uint32_t) id(esp_pending_ext_seconds));
              id(esp_pending_ext_seconds) = 0;
              id(esp_pending_ext_valve) = -1;
            } else if ((int) *active != id(esp_pending_ext_valve)) {
              id(esp_pending_ext_seconds) = 0;
              id(esp_pending_ext_valve) = -1;
            }
          }

sensor:
  - platform: rotary_encoder
    id: esp_ui_encoder
    pin_a:
      number: ${encoder_pin_a}
      mode: { input: true, pullup: true }
    pin_b:
      number: ${encoder_pin_b}
      mode: { input: true, pullup: true }
    publish_initial_value: false
    on_clockwise:
      then:
        - lambda: |-
            if (id(esp_ui_mode) == 1) {
              int t = id(esp_ui_adjust_target) + 60;
              if (t > 4 * 3600) t = 4 * 3600;
              id(esp_ui_adjust_target) = t;
            } else {
              const int n = 7 + ${zone_count};
              id(esp_ui_card) = (id(esp_ui_card) + 1) % n;
            }
        - script.execute: esp_ui_idle
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(esp_ui_mode) == 1) {
              int t = id(esp_ui_adjust_target) - 60;
              if (t < 60) t = 60;
              id(esp_ui_adjust_target) = t;
            } else {
              const int n = 7 + ${zone_count};
              id(esp_ui_card) = (id(esp_ui_card) + n - 1) % n;
            }
        - script.execute: esp_ui_idle

binary_sensor:
  - platform: gpio
    id: esp_ui_button
    pin:
      number: ${encoder_pin_btn}
      mode: { input: true, pullup: true }
      inverted: true
    internal: true
    on_click:
      # SHORT press: activate current card / commit ADJUST.
      - min_length: 50ms
        max_length: 800ms
        then:
          - lambda: |-
              auto s = id(${sprinkler_controller});
              const int z = ${zone_count};
              const int n = 7 + z;
              if (id(esp_ui_mode) == 1) {
                // Same commit logic as the idle script.
                auto active = s->active_valve();
                if (active.has_value()) {
                  uint32_t cur = s->time_remaining_active_valve().value_or(0);
                  int32_t target = id(esp_ui_adjust_target);
                  int32_t delta = target - (int32_t) cur;
                  if (delta > 4) {
                    id(esp_pending_ext_valve) = (int) *active;
                    id(esp_pending_ext_seconds) = delta;
                    id(esp_pending_stop_valve) = -1;
                    id(esp_pending_stop_in_secs) = 0;
                  } else if (delta < -4 && target >= 30) {
                    id(esp_pending_stop_valve) = (int) *active;
                    id(esp_pending_stop_in_secs) = target;
                    id(esp_pending_ext_valve) = -1;
                    id(esp_pending_ext_seconds) = 0;
                  }
                }
                id(esp_ui_mode) = 0;
                id(esp_ui_card) = 0;
                return;
              }
              int card = ((id(esp_ui_card) % n) + n) % n;
              if (card == 0) {
                // STATUS: short-press enters ADJUST if a manual zone is running.
                if (s->manual_valve().has_value()) {
                  id(esp_ui_adjust_target) =
                      (int) s->time_remaining_active_valve().value_or(60);
                  id(esp_ui_mode) = 1;
                }
              } else if (card >= 1 && card <= z) {
                // ZONE i (card 1..N): start (or pick up) the zone, enter ADJUST.
                int zi = card - 1;
                auto active = s->active_valve();
                bool already_running = active.has_value() && (int) *active == zi;
                if (already_running) {
                  id(esp_ui_adjust_target) =
                      (int) s->time_remaining_active_valve().value_or(60);
                } else {
                  s->start_single_valve(zi);
                  id(esp_ui_adjust_target) = (int) s->valve_run_duration(zi);
                }
                id(esp_ui_mode) = 1;
              } else if (card == z + 1) {
                s->start_full_cycle();
              } else if (card == z + 2) {
                s->shutdown();
              } else if (card == z + 3) {
                if (s->paused_valve().has_value()) s->resume();
                else if (s->active_valve().has_value()) s->pause();
              } else if (card == z + 4) {
                // RAIN DELAY: toggle 0 <-> 24
                bool active_delay =
                    id(esp_rain_delay).has_state() && (int) id(esp_rain_delay).state > 0;
                id(esp_rain_delay).make_call()
                    .set_value(active_delay ? 0.0f : 24.0f).perform();
              } else if (card == z + 5) {
                id(esp_schedule_enabled).toggle();
              }
              // card == z + 6 (INFO): no press action
          - script.execute: esp_ui_idle
      # LONG press: from Status, cancel any active run. From ADJUST, exit without commit.
      - min_length: 801ms
        max_length: 6000ms
        then:
          - lambda: |-
              auto s = id(${sprinkler_controller});
              if (id(esp_ui_mode) == 1) {
                id(esp_ui_mode) = 0;
                id(esp_ui_card) = 0;
                return;
              }
              const int z = ${zone_count};
              const int n = 7 + z;
              int card = ((id(esp_ui_card) % n) + n) % n;
              if (card == 0 &&
                  (s->active_valve().has_value() || s->paused_valve().has_value())) {
                s->shutdown();
                // Cancel any deferred adjust so it doesn't fire after the user-stop.
                id(esp_pending_ext_seconds) = 0;
                id(esp_pending_ext_valve) = -1;
                id(esp_pending_stop_in_secs) = 0;
                id(esp_pending_stop_valve) = -1;
              }
          - script.execute: esp_ui_idle
