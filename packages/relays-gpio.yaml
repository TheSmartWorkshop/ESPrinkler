# ESPrinkler - direct-GPIO relay package
#
# One GPIO-backed switch per zone, wired straight to the ESP32. ESPHome's `sprinkler`
# component opens valves by toggling these switches (valve_switch_id), so they are plain
# `switch` entities marked `internal: true` (the user-facing control is the sprinkler
# valve_switch, not the raw relay). For high zone counts or pin-starved boards, use
# relays-mcp23017.yaml instead.
#
# Many relay boards are ACTIVE-LOW - set `relay_inverted: "true"` if a LOW input energizes
# the relay. Override pins via substitutions without editing this file.

substitutions:
  relay_inverted: "false"
  zone_1_pin: GPIO16
  zone_2_pin: GPIO17
  zone_3_pin: GPIO18
  zone_4_pin: GPIO19
  pump_pin: GPIO21

switch:
  - platform: gpio
    id: relay_1
    pin: ${zone_1_pin}
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    pin: ${zone_2_pin}
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_3
    pin: ${zone_3_pin}
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_4
    pin: ${zone_4_pin}
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: pump_relay
    pin: ${pump_pin}
    inverted: ${relay_inverted}
    internal: true
    restore_mode: ALWAYS_OFF
