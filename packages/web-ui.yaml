# ESPrinkler - lightweight web UI
#
# Enables ESPHome's built-in v3 web server on port 80. The v3 UI is mobile-friendly
# and exposes EVERY entity the brain creates (state, active zone, per-zone duration
# numbers, schedule-enabled switch, rain-delay number, etc.) -- so all the "config
# bits" Joe wanted via browser are reachable here.
#
# OPTIONAL PIN. To require a code on every request, override `web_pin` in your parent
# substitutions and uncomment the `auth:` block under web_server below. The same
# substitution is read by packages/display-oled.yaml so the Info card shows the PIN.
#
# Without auth uncommented, the server is OPEN on your LAN -- fine for testing,
# pair with auth before exposing it widely.
#
# Schedule editing in the web UI requires a runtime-editable scheduler, which is
# still on the deferred list (programs are currently fixed at compile time).

substitutions:
  web_pin: "(not set)" # display-only default; set to your PIN to enable auth

web_server:
  version: 3
  port: 80
  # Uncomment to require Basic auth on every request:
  # auth:
  #   username: admin
  #   password: ${web_pin}
